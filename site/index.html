:root {
  /* ============ BRAND COLOR PALETTE ============
     The Mundo do Marketing palette is purple-led, anchored on a deep
     "night" navy-purple and lifted by a vivid violet + magenta-pink. */

  /* Deep purple / "night" — primary brand anchor */
  --mdm-night-1000: #291059;   /* hero bg, dark sections, primary text on light */
  --mdm-night-900:  #2F1359;
  --mdm-night-800:  #311662;
  --mdm-night-700:  #3A2F4D;   /* body text on light */

  /* Royal purple */
  --mdm-purple-700: #5F34A5;   /* eyebrow/accent text on light */
  --mdm-purple-600: #4C2180;
  --mdm-purple-500: #9836F8;   /* PRIMARY ACTION — violet CTA */
  --mdm-purple-400: #AB6ED1;
  --mdm-purple-300: #C5A8F5;
  --mdm-purple-200: #E2D8F5;   /* borders, dividers on light */
  --mdm-purple-100: #F4EEFF;   /* soft surface tint */

  /* Lavender / lilac */
  --mdm-lilac-500:  #7D6BE1;

  /* Pink / magenta — accent + italic highlights */
  --mdm-pink-400:   #EF7EF1;   /* hero accent words, "italic" emphasis */
  --mdm-pink-500:   #FF4497;   /* spot accent, secondary gradient stop */
  --mdm-pink-300:   #D787FF;

  /* Neutrals */
  --mdm-paper:      #FBFBFB;   /* off-white page bg */
  --mdm-white:      #FFFFFF;
  --mdm-cloud:      #ECECEC;   /* tracks, donut empties */
  --mdm-fog:        #C7C2D6;   /* faint dividers, skeleton text */
  --mdm-stone-600:  #555F70;   /* secondary text on light */
  --mdm-stone-500:  #8B92A1;   /* tertiary text, micro-copy */
  --mdm-ink:        #101010;   /* near-black */

  /* ============ SEMANTIC COLORS ============ */
  --bg:             var(--mdm-paper);
  --bg-elev:        var(--mdm-white);
  --bg-dark:        var(--mdm-night-1000);

  --fg:             var(--mdm-night-1000);  /* primary text */
  --fg-body:        var(--mdm-night-700);   /* body text */
  --fg-muted:       var(--mdm-stone-600);
  --fg-faint:       var(--mdm-stone-500);
  --fg-on-dark:     var(--mdm-white);
  --fg-on-dark-muted: rgba(255,255,255,.7);

  --accent:         var(--mdm-purple-500);
  --accent-soft:    var(--mdm-purple-700);
  --accent-pink:    var(--mdm-pink-400);

  --border:         rgba(47,19,89,.08);
  --border-strong:  rgba(47,19,89,.16);
  --border-on-dark: rgba(255,255,255,.14);

  --selection-bg:   var(--mdm-purple-500);
  --selection-fg:   #fff;

  /* ============ GRADIENTS ============ */
  /* Hero — deep purple radial-feeling diagonal */
  --grad-hero: linear-gradient(135deg, #2F1359 0%, #5F34A5 45%, #9836F8 100%);

  /* CTA — bright violet button */
  --grad-cta: linear-gradient(135deg, #9836F8 0%, #EF7EF1 100%);

  /* Brand gradient — for the diamond logomark / accent shapes */
  --grad-diamond: linear-gradient(135deg, #EF7EF1 0%, #9836F8 50%, #5F34A5 100%);

  /* Soft surface (paper → lilac) */
  --grad-paper-lilac: linear-gradient(180deg, #FBFBFB 0%, #F4EEFF 100%);

  /* Halo (for radial overlays on dark sections) */
  --grad-halo-dark:
    radial-gradient(at 80% 0%, rgba(152,54,248,.35), transparent 55%),
    radial-gradient(at 0% 100%, rgba(239,126,241,.18), transparent 50%);

  /* Hero animated halo */
  --grad-halo-hero:
    radial-gradient(at 70% 30%, rgba(239,126,241,.45), transparent 55%),
    radial-gradient(at 25% 80%, rgba(125,107,225,.50), transparent 60%);

  /* ============ TYPOGRAPHY — FAMILIES ============
     Three families, intentionally:
     · Satoshi    — DISPLAY. Headlines, big numbers. Geometric grotesk
                    with a beautiful italic used as expressive emphasis.
     · Syne       — ACCENT. Eyebrows, all-caps labels, captions.
                    Tracked-out, narrow, a little oddball — gives
                    editorial signal without being shouty.
     · Inter      — BODY / UI. All running text, forms, micro-copy.
                    Variable, so weights interpolate smoothly. */
  --font-display: "Satoshi", "Inter", system-ui, -apple-system, sans-serif;
  --font-accent:  "Syne", "Inter", system-ui, sans-serif;
  --font-body:    "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --font-mono:    ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;

  /* ============ TYPE SCALE ============
     Display is fluid and pushes large at hero size.
     Body is calm and reads well at 16px. */
  --fs-display-xl: clamp(48px, 6.6vw, 96px);
  --fs-display-l:  clamp(40px, 5vw, 72px);
  --fs-display-m:  clamp(32px, 3.6vw, 54px);
  --fs-headline-l: 38px;
  --fs-headline-m: 26px;
  --fs-headline-s: 22px;
  --fs-num-xl:     clamp(56px, 5.8vw, 88px);
  --fs-num-l:      54px;
  --fs-num-m:      34px;
  --fs-body-l:     20px;
  --fs-body:       16px;
  --fs-body-s:     14px;
  --fs-caption:    13px;
  --fs-micro:      12px;
  --fs-eyebrow:    12px;

  /* line height + tracking */
  --lh-tight:   1.02;
  --lh-snug:    1.08;
  --lh-normal:  1.45;
  --lh-loose:   1.55;
  --tr-display: -.03em;
  --tr-headline:-.025em;
  --tr-num:     -.045em;
  --tr-eyebrow:  .14em;
  --tr-accent:  -.02em;

  /* ============ SPACING ============ */
  --space-0:   0;
  --space-1:   4px;
  --space-2:   8px;
  --space-3:   12px;
  --space-4:   16px;
  --space-5:   20px;
  --space-6:   24px;
  --space-7:   32px;
  --space-8:   40px;
  --space-9:   48px;
  --space-10:  64px;
  --space-11:  80px;
  --space-12:  96px;
  --space-13:  120px;

  /* container */
  --container-max: 1280px;
  --container-pad: 32px;

  /* ============ RADIUS ============ */
  --r-1:  6px;
  --r-2:  8px;     /* fields, small buttons */
  --r-3:  10px;    /* primary buttons */
  --r-4:  12px;    /* large CTAs */
  --r-5:  16px;    /* small cards / chips */
  --r-6:  18px;    /* cards */
  --r-7:  24px;    /* large cards, panels */
  --r-8:  30px;    /* hero cards */
  --r-pill: 999px;

  /* ============ SHADOWS ============ */
  --shadow-xs:   0 1px 2px rgba(47,19,89,.06);
  --shadow-sm:   0 4px 14px rgba(47,19,89,.06);
